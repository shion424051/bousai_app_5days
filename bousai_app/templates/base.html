<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="site-header">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">防</span>
      <span class="brand-name"><strong>防災アプリ</strong><small>LOCAL SAFETY INFORMATION</small></span>
    </a>
    <nav class="site-nav" aria-label="メインナビゲーション">
      <a href="/">ホーム</a>
      <a href="/evacuation_route">避難経路表示</a>
      <a href="/shelter_search">避難所検索</a>
      <a href="/shelter_add">避難所登録</a>
      <a href="/hazard_report">危険箇所を投稿</a>
      <a href="/board">指示・発信ボード</a>
    </nav>
    <div class="account-nav">
    {% if session.logged_in %}
      <span>ログイン中{% if session.username %}（{{ session.username }}）{% endif %}</span>
      <a href="/logout">ログアウト</a>
    {% else %}
      <a href="/login">ログイン</a>
    {% endif %}
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
